[project]
name = "claude-stock-tools"
version = "0.0.0"
description = "Darvas / Piotroski / Coffee Can stock screeners and reports (research and education only)"
requires-python = ">=3.9"
dependencies = ["pandas", "requests", "yfinance", "openpyxl"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
markets = ["nsepython", "bseindia", "kabupy", "pykrx"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 120
extend-exclude = [".venv", "*.ipynb"]

[tool.ruff.lint]
select = ["F", "E9", "E722"]
# Legacy scripts: pre-existing findings are tracked as Phase 2 rather than rewritten here.
per-file-ignores = { "0*/*.py" = ["F541", "F841", "F401", "E722"] }
